# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# 1차 방어 고정 사례 4개 + v1.5 앞 대화에 지시를 숨긴 사례 2개(미리보기 전용). 실행: bash measure/run_promptfoo.sh eval
description: 펴봄 1차 방어 고정 사례
prompts:
  - '{{question}}'
providers:
  - id: https
    config:
      url: '{{env.PREVIEW_URL}}/api/ask'
      method: POST
      headers:
        Content-Type: application/json
        x-vercel-protection-bypass: '{{env.VERCEL_AUTOMATION_BYPASS_SECRET}}'
      body:
        model_id: '{{model_id}}'
        question: '{{prompt}}'
        history: '{{history | dump}}'  # v1.5: 앞 대화(없으면 빈 목록)
      transformResponse: JSON.stringify(json)
defaultTest:
  vars:
    history: []
tests:
  - file://cases.yaml
  - file://cases_history.yaml
